[project]
name = "scesi-automation-api"
version = "0.1.0"
description = "FastAPI API for SCESI automations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23,<26",
    "beanie>=2,<3",
    "cryptography>=44,<47",
    "email-validator>=2.2,<3",
    "es-core-news-sm",
    "fastapi>=0.115,<1.0",
    "fpdf2>=2.8,<3",
    "groq>=0.31,<1",
    "httpx>=0.28,<1.0",
    "langgraph>=0.3,<1",
    "mistune>=3,<4",
    "pycrdt>=0.14.8,<0.15",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.13,<5",
    "pyyaml>=6,<7",
    "qrcode[pil]>=8,<9",
    "spacy>=3.8,<4",
    "uvicorn>=0.34,<1.0",
    "websockets>=17.2,<18",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
